name: Deploy

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions: { contents: read, deployments: write, pull-requests: write }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build Astro and check
        run: |
          cd astro && npm ci && npm run build && cd ..
          node check-astro.mjs
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: astro/dist/, retention-days: 7 }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.cf.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd astro && npm ci && npm run build
      - name: Deploy to Cloudflare Pages
        id: cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy astro/dist --project-name=sohaibsohail --branch=${{ github.head_ref || github.ref_name }}
